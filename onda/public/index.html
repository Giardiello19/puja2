<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>PUJA — Subastas en vivo de coleccionables</title>
<meta name="description" content="Compra y vende cartas, tenis y coleccionables en subastas en vivo. Puja en tiempo real.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div class="statusbar-spacer"></div>
  <main id="view-root"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-route="feed">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M3 11.5L12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tab" data-route="explore">
      <svg viewBox="0 0 24 24" class="tab-icon"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Explorar</span>
    </button>
    <button class="tab tab-center" data-route="sell">
      <span class="tab-center-circle">
        <svg viewBox="0 0 24 24" class="tab-icon-center"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </span>
    </button>
    <button class="tab" data-route="activity">
      <svg viewBox="0 0 24 24" class="tab-icon"><path d="M12 21s-7.5-4.6-10-9.3C0.4 8.4 2 5 5.4 5 7.6 5 9 6.2 12 9c3-2.8 4.4-4 6.6-4 3.4 0 5 3.4 3.4 6.7C19.5 16.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Pujas</span>
    </button>
    <button class="tab" data-route="profile">
      <svg viewBox="0 0 24 24" class="tab-icon"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.2-3.8 4.2-6 7.5-6s6.3 2.2 7.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Perfil</span>
    </button>
  </nav>

  <div id="toast-stack" class="toast-stack"></div>
</div>

<!-- Tiempo real -->
<script src="/socket.io/socket.io.js"></script>
<!-- Video en vivo (LiveKit, open source) -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
